[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-game-2.0"
version = "0.0.1"
description = "An Open-Source, Real-Time, and Streaming Interactive World Model"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Note: flash-attn is required but installed separately via pre-built wheel (see setup script)
dependencies = [
  "accelerate>=1.1.1",
  "av",
  "clip @ git+https://github.com/openai/CLIP.git",
  "dashscope",
  "diffusers",
  "dominate",
  "easydict",
  "einops",
  "fastapi",
  "flask",
  "flask-socketio",
  "ftfy",
  "huggingface_hub",
  "imageio",
  "imageio-ffmpeg",
  "lmdb",
  "matplotlib",
  "numpy",
  "omegaconf",
  "open_clip_torch",
  "opencv-python>=4.9.0.80",
  "pycocotools",
  "pydantic",
  "safetensors",
  "scikit-image",
  "scipy",
  "sentencepiece",
  "starlette",
  "tokenizers>=0.20.3",
  "torch==2.8.0+cu128 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.8.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "torchvision==0.23.0+cu128 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchvision==0.23.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "tqdm",
  "transformers>=4.49.0",
  "uvicorn[standard]",
  "wandb",
  "hf_transfer",
  "google-genai",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["demo_utils*", "pipeline*", "utils*", "wan*"]
