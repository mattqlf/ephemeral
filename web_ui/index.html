<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-dim: #4a4a4a;
            --text-muted: #333;
            --accent: #7eb8a8;
            --accent-glow: rgba(126, 184, 168, 0.15);
            --accent-bright: #a3d4c5;
            --border: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.10);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
        }

        /* Hero background */
        .bg-image {
            position: fixed;
            inset: 0;
            background: url('assets/hero.png') center/60% no-repeat;
            opacity: 0.30;
            filter: blur(1px);
        }

        /* Vignette */
        .bg-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, var(--bg) 80%);
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frame {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 48px 80px;
            position: relative;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: var(--font-body);
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            color: var(--text);
            text-transform: uppercase;
        }

        .tagline {
            font-size: 15px;
            color: var(--text-dim);
            line-height: 2;
            margin-bottom: 16px;
            letter-spacing: 0.03em;
            font-weight: 300;
        }

        .definition {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 28px;
            opacity: 0.7;
            font-style: italic;
            font-weight: 300;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cta {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 32px;
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text);
            text-decoration: none;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: all var(--transition-normal);
            min-width: 200px;
            position: relative;
        }

        .cta:hover {
            border-color: var(--accent);
            color: var(--accent-bright);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .cta-sub {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            text-transform: none;
            font-weight: 300;
        }

        .cta:hover .cta-sub {
            color: inherit;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-vignette"></div>

    <div class="container">
        <div class="frame">
            <h1>Ephemeral</h1>

            <p class="tagline">
                Worlds that never were.<br>
                Gone before you blink.
            </p>

            <div class="definition">
                lasting for a very short time
            </div>

            <div class="cta-group">
                <a href="app.html" class="cta">
                    <span>Dream v1</span>
                    <span class="cta-sub">Real-time interactive worlds</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
