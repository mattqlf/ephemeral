<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/75325/PressStart2P-Regular.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-dim: #4a4a4a;
            --accent: #00d4aa;
            --border: #1a1a1a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            image-rendering: pixelated;
        }

        /* Hero background */
        .bg-image {
            position: fixed;
            inset: 0;
            background: url('/assets/hero.png') center/cover no-repeat;
            opacity: 0.35;
            image-rendering: pixelated;
        }

        /* Scanline effect */
        .bg-scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            pointer-events: none;
        }

        /* Vignette */
        .bg-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, var(--bg) 80%);
        }

        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px;
        }

        /* ASCII frame */
        .frame {
            border: 1px solid var(--border);
            padding: 64px 80px;
            position: relative;
            background: rgba(10, 10, 10, 0.7);
        }

        .frame::before {
            content: '┌─────────────────────────────────────┐';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: -1px;
        }

        .frame::after {
            content: '└─────────────────────────────────────┘';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: -1px;
        }

        h1 {
            font-family: 'Pixel', 'Courier New', monospace;
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 400;
            letter-spacing: 0.1em;
            margin-bottom: 40px;
            color: var(--text);
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(0, 212, 170, 0.3);
        }

        .tagline {
            max-width: 440px;
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            line-height: 2;
            margin-bottom: 32px;
            letter-spacing: 0.05em;
        }

        .definition {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 48px;
            opacity: 0.7;
        }

        .definition span {
            color: var(--accent);
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .cta:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.2);
        }

        .cta::before {
            content: '>';
            opacity: 0;
            transition: opacity 0.2s;
        }

        .cta:hover::before {
            opacity: 1;
        }

        .corner {
            position: fixed;
            font-size: 10px;
            color: var(--text-dim);
            opacity: 0.5;
            letter-spacing: 0.1em;
        }

        .corner.tl { top: 20px; left: 20px; }
        .corner.tr { top: 20px; right: 20px; }
        .corner.bl { bottom: 20px; left: 20px; }
        .corner.br { bottom: 20px; right: 20px; }

        .corner.bl::before {
            content: '░░░░░';
            display: block;
            margin-bottom: 4px;
            opacity: 0.3;
        }

        .corner.br::after {
            content: '░░░░░';
            display: block;
            margin-top: 4px;
            opacity: 0.3;
        }

        /* Blinking cursor */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--accent);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-vignette"></div>
    <div class="bg-scanlines"></div>

    <div class="corner tl">SYS.2025</div>
    <div class="corner tr">v2.0</div>
    <div class="corner bl">READY</div>
    <div class="corner br">OK</div>

    <div class="container">
        <div class="frame">
            <h1>Ephemeral</h1>

            <p class="tagline">
                Worlds that never were.<br>
                Gone before you blink.
            </p>

            <div class="definition">
                <span>></span> lasting for a very short time
            </div>

            <a href="app.html" class="cta">
                Enter<span class="cursor"></span>
            </a>
        </div>
    </div>
</body>
</html>
