<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Ephemeral Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-dim: #4a4a4a;
            --text-muted: #333;
            --accent: #7eb8a8;
            --accent-glow: rgba(126, 184, 168, 0.15);
            --accent-bright: #a3d4c5;
            --border: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.10);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-dot.waiting {
            background: var(--accent);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .status-dot.error {
            background: #ff4444;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        .control-group {
            text-align: center;
        }

        .group-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .key {
            width: 68px;
            height: 68px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all var(--transition-fast);
            gap: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        .key:active:not(.empty) {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
            transform: scale(0.95);
        }

        .key:active:not(.empty) .key-hint {
            color: var(--bg);
        }

        .key.empty { visibility: hidden; }

        .key-hint {
            font-family: var(--font-mono);
            font-size: 8px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Name entry overlay */
        .name-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 100;
            opacity: 1;
            transition: opacity var(--transition-slow);
        }

        .name-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .name-title {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 400;
        }

        .name-input {
            width: 220px;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .name-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .name-input::placeholder {
            color: var(--text-muted);
        }

        .name-go-btn {
            padding: 12px 28px;
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: var(--bg);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .name-go-btn:active {
            transform: scale(0.97);
        }

        .closed-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .closed-overlay.visible {
            display: flex;
        }

        .closed-title {
            font-size: 14px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .closed-sub {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ── Modal mode: video canvas + controls layout ── */
        .modal-layout {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .modal-layout.active {
            display: flex;
        }

        .video-area {
            flex: 1;
            position: relative;
            background: #000;
            min-height: 0;
            overflow: hidden;
        }

        .video-area canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        .caption-overlay {
            position: absolute;
            bottom: 10%;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            padding: 0 10px;
        }

        .caption-text {
            display: inline-block;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 400;
            color: #e0e0e0;
            text-shadow: 0 0 12px rgba(126, 184, 168, 0.3), 0 1px 4px rgba(0,0,0,0.9);
            letter-spacing: 0.02em;
            line-height: 1.5;
            opacity: 0;
            transition: opacity var(--transition-normal);
        }

        .caption-text.visible { opacity: 1; }
        .caption-text.fading { opacity: 0; transition: opacity 1.5s ease; }

        .caption-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: middle;
            animation: cursor-breathe 1.2s ease-in-out infinite;
        }

        @keyframes cursor-breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .modal-controls {
            display: flex;
            gap: 12px;
            padding: 12px;
            justify-content: center;
            flex-shrink: 0;
        }

        .modal-controls .key {
            width: 54px;
            height: 54px;
            font-size: 14px;
        }

        .modal-controls .key-hint {
            font-size: 7px;
        }

        /* Action sent pulse on video area */
        .video-area.action-pulse {
            box-shadow: inset 0 0 30px var(--accent-glow);
        }

        /* Queue overlay */
        .queue-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 90;
        }

        .queue-overlay.visible {
            display: flex;
        }

        .queue-position {
            font-size: 48px;
            color: var(--accent);
            font-weight: bold;
        }

        .queue-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .queue-message {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Loading overlay with mosaic */
        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 90;
        }

        .loading-overlay.visible {
            display: flex;
        }

        .loading-mosaic {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3px;
            width: min(280px, 70vw);
            aspect-ratio: 640 / 352;
        }

        .mosaic-tile {
            background: rgba(126, 184, 168, 0.06);
            border-radius: 2px;
            animation: mosaic-pulse 2.5s ease-in-out infinite;
        }

        @keyframes mosaic-pulse {
            0%, 100% { background: rgba(126, 184, 168, 0.04); }
            50% { background: rgba(126, 184, 168, 0.12); }
        }

        .loading-text {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Modal layout fade-in */
        .modal-layout.active {
            animation: fade-in var(--transition-slow) ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>
    <div class="name-overlay" id="nameOverlay">
        <div class="name-title">Enter your name</div>
        <input type="text" class="name-input" id="nameInput" placeholder="Player" maxlength="16" autocomplete="off" />
        <button class="name-go-btn" id="nameGoBtn">Join</button>
    </div>

    <header>
        <span class="logo">Ephemeral Remote</span>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
            <span id="playerCount"></span>
        </div>
    </header>

    <!-- Video + controls -->
    <div class="modal-layout" id="modalLayout">
        <div class="video-area">
            <canvas id="videoCanvas" width="640" height="352"></canvas>
            <div class="caption-overlay">
                <span class="caption-text" id="captionText"></span>
            </div>
        </div>
        <div class="modal-controls">
            <div class="control-group">
                <div class="key-grid">
                    <div class="key empty"></div>
                    <div class="key" data-key="i" data-type="camera"><span>I</span><span class="key-hint">up</span></div>
                    <div class="key empty"></div>
                    <div class="key" data-key="j" data-type="camera"><span>J</span><span class="key-hint">left</span></div>
                    <div class="key" data-key="u" data-type="camera"><span>U</span><span class="key-hint">none</span></div>
                    <div class="key" data-key="l" data-type="camera"><span>L</span><span class="key-hint">right</span></div>
                    <div class="key empty"></div>
                    <div class="key" data-key="k" data-type="camera"><span>K</span><span class="key-hint">down</span></div>
                    <div class="key empty"></div>
                </div>
            </div>
            <div class="control-group">
                <div class="key-grid">
                    <div class="key empty"></div>
                    <div class="key" data-key="w" data-type="movement"><span>W</span><span class="key-hint">fwd</span></div>
                    <div class="key empty"></div>
                    <div class="key" data-key="a" data-type="movement"><span>A</span><span class="key-hint">left</span></div>
                    <div class="key" data-key="q" data-type="movement"><span>Q</span><span class="key-hint">none</span></div>
                    <div class="key" data-key="d" data-type="movement"><span>D</span><span class="key-hint">right</span></div>
                    <div class="key empty"></div>
                    <div class="key" data-key="s" data-type="movement"><span>S</span><span class="key-hint">back</span></div>
                    <div class="key empty"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Queue overlay -->
    <div class="queue-overlay" id="queueOverlay">
        <div class="queue-label">Queue Position</div>
        <div class="queue-position" id="queuePosition">-</div>
        <div class="queue-message" id="queueMessage">Waiting for a spot...</div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-mosaic" id="loadingMosaic"></div>
        <div class="loading-text" id="loadingText">Loading your world...</div>
    </div>

    <div class="closed-overlay" id="closedOverlay">
        <div class="closed-title">Room Closed</div>
        <div class="closed-sub">The host ended the session</div>
    </div>

    <audio id="bgMusic" loop preload="none"></audio>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const playerCount = document.getElementById('playerCount');
        const closedOverlay = document.getElementById('closedOverlay');
        const nameOverlay = document.getElementById('nameOverlay');
        const nameInput = document.getElementById('nameInput');
        const nameGoBtn = document.getElementById('nameGoBtn');
        const modalLayout = document.getElementById('modalLayout');
        const videoCanvas = document.getElementById('videoCanvas');
        const videoCtx = videoCanvas.getContext('2d');
        const captionText = document.getElementById('captionText');
        const queueOverlay = document.getElementById('queueOverlay');
        const queuePosition = document.getElementById('queuePosition');
        const queueMessage = document.getElementById('queueMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const bgMusic = document.getElementById('bgMusic');

        // Build mosaic tiles
        const mosaicEl = document.getElementById('loadingMosaic');
        for (let i = 0; i < 24; i++) {
            const tile = document.createElement('div');
            tile.className = 'mosaic-tile';
            tile.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's';
            mosaicEl.appendChild(tile);
        }

        // Extract room_id from URL path: /room/{room_id} or /modal-room/{room_id}
        const pathParts = location.pathname.split('/');
        const roomId = pathParts[pathParts.length - 1];
        let ws = null;
        let playerName = '';
        let lastKeyboard = 'q';
        let lastMouse = 'u';
        let captionFadeTimer = null;
        let captionTypeTimer = null;

        // ── Name entry ──
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitName();
        });
        nameGoBtn.addEventListener('click', submitName);

        function submitName() {
            playerName = nameInput.value.trim() || 'Player';
            nameOverlay.classList.add('hidden');
            connect();
        }

        function setStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsPath = `/ws/modal-room/${roomId}`;
            ws = new WebSocket(`${protocol}//${location.host}${wsPath}`);

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                ws.send(JSON.stringify({ type: 'join', name: playerName }));
            };

            ws.onclose = (e) => {
                if (e.code === 4004) {
                    closedOverlay.classList.add('visible');
                    document.querySelector('.closed-sub').textContent = 'Room not found';
                    return;
                }
                setStatus('Disconnected', 'error');
                closedOverlay.classList.add('visible');
            };

            ws.onerror = () => setStatus('Error', 'error');
            ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'queued':
                    queueOverlay.classList.add('visible');
                    loadingOverlay.classList.remove('visible');
                    queuePosition.textContent = `#${msg.position}`;
                    queueMessage.textContent = msg.message || 'Waiting for a spot...';
                    setStatus(`Queue #${msg.position}`, 'waiting');
                    break;

                case 'initializing':
                    queueOverlay.classList.remove('visible');
                    loadingOverlay.classList.add('visible');
                    loadingText.textContent = msg.message || 'Loading your world...';
                    setStatus('Loading...', 'waiting');
                    break;

                case 'ready':
                    // Switch to Modal mode layout
                    enterModalMode(msg.resolution);
                    setStatus('Playing', 'connected');
                    break;

                case 'frame':
                    displayFrame(msg.data);
                    break;

                case 'request_action':
                    // Don't auto-send — wait for the player to tap
                    setStatus(`Block ${msg.block}`, 'connected');
                    break;

                case 'caption':
                    showCaption(msg.text, msg.color);
                    break;

                case 'music_ready':
                    if (msg.audio_urls && msg.audio_urls.length > 0) {
                        bgMusic.src = msg.audio_urls[0];
                        bgMusic.volume = 0.4;
                        bgMusic.play().catch(() => {});
                    }
                    break;

                case 'room_closed':
                    closedOverlay.classList.add('visible');
                    break;

                case 'error':
                    setStatus('Error', 'error');
                    loadingOverlay.classList.remove('visible');
                    queueOverlay.classList.remove('visible');
                    break;

                case 'session_ended':
                    closedOverlay.querySelector('.closed-title').textContent = 'Session Ended';
                    closedOverlay.querySelector('.closed-sub').textContent = msg.reason || 'Your session has ended';
                    closedOverlay.classList.add('visible');
                    break;
            }
        }

        function enterModalMode(resolution) {
            modalLayout.classList.add('active');
            queueOverlay.classList.remove('visible');
            loadingOverlay.classList.remove('visible');

            if (resolution) {
                const [w, h] = resolution.split('x').map(Number);
                videoCanvas.width = w;
                videoCanvas.height = h;
            }
            resizeVideoCanvas();
        }

        let _frameSeq = 0;
        let _nextDrawSeq = 1;
        const _frameBuffer = {};
        function displayFrame(b64) {
            const seq = ++_frameSeq;
            const img = new Image();
            img.onload = () => {
                _frameBuffer[seq] = img;
                while (_frameBuffer[_nextDrawSeq]) {
                    videoCtx.drawImage(_frameBuffer[_nextDrawSeq], 0, 0, videoCanvas.width, videoCanvas.height);
                    delete _frameBuffer[_nextDrawSeq];
                    _nextDrawSeq++;
                }
            };
            img.src = 'data:image/jpeg;base64,' + b64;
        }

        function showCaption(text, color) {
            clearTimeout(captionFadeTimer);
            clearInterval(captionTypeTimer);

            captionText.textContent = '';
            captionText.style.color = color || '#e0e0e0';
            captionText.style.textShadow = `0 0 8px ${color || '#e0e0e0'}40, 0 1px 3px rgba(0,0,0,0.9)`;
            captionText.className = 'caption-text visible';

            const fullText = text || '';
            let charIdx = 0;
            const cursor = document.createElement('span');
            cursor.className = 'caption-cursor';
            cursor.style.background = color || 'var(--accent)';
            captionText.appendChild(cursor);

            captionTypeTimer = setInterval(() => {
                if (charIdx < fullText.length) {
                    cursor.remove();
                    captionText.insertAdjacentText('beforeend', fullText[charIdx]);
                    captionText.appendChild(cursor);
                    charIdx++;
                } else {
                    clearInterval(captionTypeTimer);
                    cursor.remove();
                    captionFadeTimer = setTimeout(() => {
                        captionText.className = 'caption-text fading';
                    }, 4000);
                }
            }, 35);
        }

        function sendAction(keyboard, mouse) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'action', keyboard, mouse }));
            }
        }

        function handleKeyTap(key, type) {
            if (type === 'camera') {
                lastMouse = key;
                lastKeyboard = 'q';
            } else {
                lastKeyboard = key;
                lastMouse = 'u';
            }
            sendAction(lastKeyboard, lastMouse);
            // Action pulse on video area
            const videoArea = document.querySelector('.video-area');
            if (videoArea) {
                videoArea.classList.add('action-pulse');
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    videoArea.style.transition = 'box-shadow 0.4s ease-out';
                    videoArea.classList.remove('action-pulse');
                    setTimeout(() => { videoArea.style.transition = ''; }, 400);
                }));
            }
        }

        function resizeVideoCanvas() {
            const area = document.querySelector('.video-area');
            if (!area) return;
            const areaW = area.clientWidth;
            const areaH = area.clientHeight;
            const aspect = videoCanvas.width / videoCanvas.height;
            let w, h;
            if (areaW / areaH > aspect) {
                h = areaH;
                w = h * aspect;
            } else {
                w = areaW;
                h = w / aspect;
            }
            videoCanvas.style.width = w + 'px';
            videoCanvas.style.height = h + 'px';
        }

        window.addEventListener('resize', resizeVideoCanvas);

        // Touch/click handlers for all keys
        document.querySelectorAll('.key:not(.empty)').forEach(el => {
            function handleTapEvent(e) {
                e.preventDefault();
                handleKeyTap(el.dataset.key, el.dataset.type);
            }
            el.addEventListener('touchstart', handleTapEvent, { passive: false });
            el.addEventListener('click', handleTapEvent);
        });

        // Focus name input on load
        nameInput.focus();
    </script>
</body>
</html>
