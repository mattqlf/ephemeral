<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Ephemeral Remote</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --text: #e0e0e0;
            --text-dim: #4a4a4a;
            --text-muted: #333;
            --accent: #00d4aa;
            --border: #1a1a1a;
            --border-light: #2a2a2a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-dot.error {
            background: #ff4444;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        .control-group {
            text-align: center;
        }

        .group-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .key {
            width: 64px;
            height: 64px;
            background: #151515;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.1s;
            gap: 3px;
            -webkit-tap-highlight-color: transparent;
        }

        .key:active:not(.empty) {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .key:active:not(.empty) .key-hint {
            color: var(--bg);
        }

        .key.empty { visibility: hidden; }

        .key-hint {
            font-size: 8px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Name entry overlay */
        .name-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 100;
        }

        .name-overlay.hidden {
            display: none;
        }

        .name-title {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .name-input {
            width: 200px;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border-light);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: center;
            outline: none;
        }

        .name-input:focus {
            border-color: var(--accent);
        }

        .name-input::placeholder {
            color: var(--text-muted);
        }

        .name-go-btn {
            padding: 10px 24px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--bg);
            cursor: pointer;
        }

        .closed-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .closed-overlay.visible {
            display: flex;
        }

        .closed-title {
            font-size: 14px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .closed-sub {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* World selection overlay */
        .world-select-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            z-index: 100;
        }

        .world-select-overlay.hidden {
            display: none;
        }

        .world-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 20px;
        }

        .world-btn {
            padding: 16px 24px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }

        .world-btn:active, .world-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .world-btn-sub {
            display: block;
            font-size: 8px;
            color: var(--text-dim);
            margin-top: 4px;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="name-overlay" id="nameOverlay">
        <div class="name-title">Enter your name</div>
        <input type="text" class="name-input" id="nameInput" placeholder="Player" maxlength="16" autocomplete="off" />
        <button class="name-go-btn" id="nameGoBtn">> Join</button>
    </div>

    <div class="world-select-overlay hidden" id="worldSelectOverlay">
        <div class="name-title">Select Your World</div>
        <div class="world-buttons" id="worldButtons"></div>
    </div>

    <header>
        <span class="logo">Ephemeral Remote</span>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
            <span id="playerCount"></span>
        </div>
    </header>

    <div class="main">
        <div class="control-group">
            <div class="group-label">Camera</div>
            <div class="key-grid">
                <div class="key empty"></div>
                <div class="key" data-key="i" data-type="camera"><span>I</span><span class="key-hint">up</span></div>
                <div class="key empty"></div>
                <div class="key" data-key="j" data-type="camera"><span>J</span><span class="key-hint">left</span></div>
                <div class="key" data-key="u" data-type="camera"><span>U</span><span class="key-hint">none</span></div>
                <div class="key" data-key="l" data-type="camera"><span>L</span><span class="key-hint">right</span></div>
                <div class="key empty"></div>
                <div class="key" data-key="k" data-type="camera"><span>K</span><span class="key-hint">down</span></div>
                <div class="key empty"></div>
            </div>
        </div>

        <div class="control-group">
            <div class="group-label">Movement</div>
            <div class="key-grid">
                <div class="key empty"></div>
                <div class="key" data-key="w" data-type="movement"><span>W</span><span class="key-hint">fwd</span></div>
                <div class="key empty"></div>
                <div class="key" data-key="a" data-type="movement"><span>A</span><span class="key-hint">left</span></div>
                <div class="key" data-key="q" data-type="movement"><span>Q</span><span class="key-hint">none</span></div>
                <div class="key" data-key="d" data-type="movement"><span>D</span><span class="key-hint">right</span></div>
                <div class="key empty"></div>
                <div class="key" data-key="s" data-type="movement"><span>S</span><span class="key-hint">back</span></div>
                <div class="key empty"></div>
            </div>
        </div>
    </div>

    <div class="closed-overlay" id="closedOverlay">
        <div class="closed-title">Room Closed</div>
        <div class="closed-sub">The host ended the session</div>
    </div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const playerCount = document.getElementById('playerCount');
        const closedOverlay = document.getElementById('closedOverlay');
        const nameOverlay = document.getElementById('nameOverlay');
        const nameInput = document.getElementById('nameInput');
        const nameGoBtn = document.getElementById('nameGoBtn');
        const worldSelectOverlay = document.getElementById('worldSelectOverlay');
        const worldButtons = document.getElementById('worldButtons');

        // Extract room_id from URL path: /room/{room_id}
        const pathParts = location.pathname.split('/');
        const roomId = pathParts[pathParts.length - 1];

        let ws = null;
        let playerName = '';
        let selectedWorldId = 0;

        // ── Name entry ──
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitName();
        });
        nameGoBtn.addEventListener('click', submitName);

        function submitName() {
            playerName = nameInput.value.trim() || 'Player';
            nameOverlay.classList.add('hidden');
            connect();
        }

        function setStatus(text, state) {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/room/${roomId}`);

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                // Send join with name
                ws.send(JSON.stringify({ type: 'join', name: playerName }));
            };

            ws.onclose = (e) => {
                if (e.code === 4004) {
                    closedOverlay.classList.add('visible');
                    document.querySelector('.closed-sub').textContent = 'Room not found';
                    return;
                }
                setStatus('Disconnected', 'error');
                closedOverlay.classList.add('visible');
            };

            ws.onerror = () => setStatus('Error', 'error');

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                switch (msg.type) {
                    case 'room_joined':
                        setStatus('Joined', 'connected');
                        playerCount.textContent = `${msg.player_count} player${msg.player_count !== 1 ? 's' : ''}`;
                        break;
                    case 'room_update':
                        playerCount.textContent = `${msg.player_count} player${msg.player_count !== 1 ? 's' : ''}`;
                        break;
                    case 'room_closed':
                        closedOverlay.classList.add('visible');
                        break;
                    case 'select_world':
                        showWorldSelection(msg.num_worlds);
                        break;
                }
            };
        }

        function showWorldSelection(numWorlds) {
            worldButtons.innerHTML = '';
            for (let i = 0; i < numWorlds; i++) {
                const btn = document.createElement('button');
                btn.className = 'world-btn';
                btn.innerHTML = `World ${i + 1}` +
                    (i === 0 ? '<span class="world-btn-sub">host world</span>' : '');
                btn.addEventListener('click', () => {
                    selectedWorldId = i;
                    ws.send(JSON.stringify({ type: 'select_world', world_id: i }));
                    worldSelectOverlay.classList.add('hidden');
                });
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    selectedWorldId = i;
                    ws.send(JSON.stringify({ type: 'select_world', world_id: i }));
                    worldSelectOverlay.classList.add('hidden');
                }, { passive: false });
                worldButtons.appendChild(btn);
            }
            worldSelectOverlay.classList.remove('hidden');
        }

        function sendVote(keyboard, mouse) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'vote', keyboard, mouse, name: playerName }));
            }
        }

        // Touch/click handlers
        document.querySelectorAll('.key:not(.empty)').forEach(el => {
            function handleTap(e) {
                e.preventDefault();
                const key = el.dataset.key;
                const type = el.dataset.type;
                if (type === 'camera') {
                    sendVote('q', key);
                } else {
                    sendVote(key, 'u');
                }
            }
            el.addEventListener('touchstart', handleTap, { passive: false });
            el.addEventListener('click', handleTap);
        });

        // Focus name input on load
        nameInput.focus();
    </script>
</body>
</html>
