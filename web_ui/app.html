<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral</title>
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('https://fonts.cdnfonts.com/s/75325/PressStart2P-Regular.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --bg-panel: rgba(10, 10, 10, 0.85);
            --text: #e0e0e0;
            --text-dim: #4a4a4a;
            --text-muted: #333;
            --accent: #00d4aa;
            --border: #1a1a1a;
            --border-light: #2a2a2a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            image-rendering: pixelated;
        }

        /* Scanline effect - disabled */
        .bg-scanlines {
            display: none;
        }

        .app {
            display: grid;
            grid-template-columns: 1fr 260px;
            grid-template-rows: auto 1fr;
            height: 100vh;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Pixel', 'Courier New', monospace;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-decoration: none;
            color: var(--text);
            text-transform: uppercase;
        }

        .logo:hover {
            color: var(--accent);
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 10px;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-dot.waiting {
            background: var(--accent);
            animation: blink 1s step-end infinite;
        }

        .status-dot.error {
            background: #ff4444;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Video section */
        .video-section {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .video-container {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            position: relative;
            min-height: 0; /* Allow flex shrinking */
        }

        #videoCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 14px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* Image bar */
        .image-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
        }

        .image-bar-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .image-tabs {
            display: flex;
        }

        .tab-btn {
            padding: 5px 10px;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.15s;
        }

        .tab-btn:first-child { border-right: none; }
        .tab-btn:hover { border-color: var(--border-light); color: var(--text); }
        .tab-btn.active { background: var(--border); color: var(--text); }

        .image-select-wrapper {
            flex: 1;
        }

        .image-select-wrapper select {
            width: 100%;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            outline: none;
            color-scheme: dark;
        }

        .image-select-wrapper select option {
            background: #1a1a1a;
            color: var(--text);
            padding: 8px;
        }

        .image-select-wrapper select option:checked {
            background: var(--accent);
            color: var(--bg);
        }

        .upload-inline {
            display: none;
            flex: 1;
            align-items: center;
            gap: 8px;
        }

        .upload-inline.active { display: flex; }

        .upload-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px dashed var(--border-light);
            color: var(--text-dim);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .upload-preview {
            display: none;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .upload-preview.active { display: flex; }

        .upload-preview img {
            width: 40px;
            height: 22px;
            object-fit: cover;
            border: 1px solid var(--border);
            image-rendering: pixelated;
        }

        .upload-preview-name {
            flex: 1;
            font-size: 10px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-remove {
            padding: 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 0;
        }

        .upload-remove:hover { color: #ff4444; }

        /* Prompt bar */
        .prompt-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
        }

        .prompt-bar-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .prompt-input {
            flex: 1;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            outline: none;
        }

        .prompt-input::placeholder {
            color: var(--text-muted);
        }

        .prompt-input:focus {
            border-color: var(--accent);
        }

        .prompt-badge {
            font-size: 8px;
            color: var(--bg);
            background: var(--accent);
            padding: 2px 6px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Control panel */
        .control-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
        }

        .section-title {
            font-size: 9px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .section-title span {
            color: var(--accent);
        }

        .section-title.sub {
            font-size: 8px;
            color: #666;
            margin-bottom: 6px;
        }

        /* Key controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .key {
            aspect-ratio: 1;
            background: #151515;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.1s;
            gap: 2px;
        }

        .key:hover:not(.disabled):not(.empty) {
            border-color: #555;
            color: var(--text);
            background: #1a1a1a;
        }

        .key.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .key.empty { visibility: hidden; }
        .key.disabled { opacity: 0.35; pointer-events: none; }

        .key-hint {
            font-size: 7px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .key.active .key-hint { color: var(--bg); }
        .key:hover:not(.disabled) .key-hint { color: #888; }

        /* Sequence display */
        .sequence-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-dim);
        }

        .sequence-step.active { color: var(--accent); }
        .sequence-step.complete { color: var(--text); }
        .sequence-value { font-weight: bold; min-width: 14px; }
        .sequence-arrow { color: var(--text-muted); }

        /* Hint */
        .hint-text {
            font-size: 9px;
            color: var(--text-muted);
            line-height: 1.6;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .hint-text code {
            color: var(--text-dim);
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 10px 14px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: var(--text);
            color: var(--bg);
        }

        .btn:disabled { opacity: 0.3; pointer-events: none; }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .btn-primary:hover:not(:disabled) {
            background: #00e8bb;
            border-color: #00e8bb;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>
    <div class="bg-scanlines"></div>

    <div class="app">
        <header>
            <a href="#" class="logo">Ephemeral</a>

            <div class="header-meta">
                <span>Block: <strong id="blockNum">0</strong></span>
                <span>640x352</span>
            </div>

            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="video-section">
            <div class="video-container">
                <canvas id="videoCanvas" width="640" height="352"></canvas>
                <div class="video-overlay">
                    <span id="inputDisplay">> waiting for input...</span>
                </div>
            </div>

            <div class="image-bar">
                <span class="image-bar-label">Source</span>
                <div class="image-tabs">
                    <button class="tab-btn active" data-tab="select">Demo</button>
                    <button class="tab-btn" data-tab="upload">Upload</button>
                </div>
                <div class="image-select-wrapper" id="selectTab">
                    <select id="imageSelect">
                        <option value="demo_images/universal/0000.png">universal/0000.png</option>
                    </select>
                </div>
                <div class="upload-inline" id="uploadTab">
                    <button class="upload-btn" id="uploadBtn">> drop or select image</button>
                    <div class="upload-preview" id="uploadPreview">
                        <img id="previewImg" src="" alt="">
                        <span class="upload-preview-name" id="previewName"></span>
                        <button class="upload-remove" id="removeUpload">×</button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="prompt-bar">
                <span class="prompt-bar-label">Prompt</span>
                <input type="text" class="prompt-input" id="promptInput" placeholder="optional: describe the world to generate (uses Gemini)" />
                <span class="prompt-badge">GEMINI</span>
            </div>
        </div>

        <div class="control-panel">
            <div>
                <div class="section-title"><span>></span> Controls</div>
                <div class="controls-grid">
                    <div>
                        <div class="section-title sub">Camera</div>
                        <div class="key-grid" id="cameraSection">
                            <div class="key empty"></div>
                            <div class="key" data-key="i" data-type="camera"><span>I</span><span class="key-hint">up</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="j" data-type="camera"><span>J</span><span class="key-hint">left</span></div>
                            <div class="key" data-key="u" data-type="camera"><span>U</span><span class="key-hint">none</span></div>
                            <div class="key" data-key="l" data-type="camera"><span>L</span><span class="key-hint">right</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="k" data-type="camera"><span>K</span><span class="key-hint">down</span></div>
                            <div class="key empty"></div>
                        </div>
                    </div>
                    <div>
                        <div class="section-title sub">Movement</div>
                        <div class="key-grid" id="movementSection">
                            <div class="key empty"></div>
                            <div class="key" data-key="w" data-type="movement"><span>W</span><span class="key-hint">fwd</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="a" data-type="movement"><span>A</span><span class="key-hint">left</span></div>
                            <div class="key" data-key="q" data-type="movement"><span>Q</span><span class="key-hint">none</span></div>
                            <div class="key" data-key="d" data-type="movement"><span>D</span><span class="key-hint">right</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="s" data-type="movement"><span>S</span><span class="key-hint">back</span></div>
                            <div class="key empty"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title"><span>></span> Sequence</div>
                <div class="sequence-display">
                    <div class="sequence-step" id="step1">
                        cam: <span class="sequence-value" id="cameraValue">-</span>
                    </div>
                    <span class="sequence-arrow">→</span>
                    <div class="sequence-step" id="step2">
                        mov: <span class="sequence-value" id="moveValue">-</span>
                    </div>
                </div>
            </div>

            <div class="hint-text">
                Press any key to send. Hold to repeat action.
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="startBtn">> Start</button>
                <button class="btn" id="stopBtn" disabled>Stop</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const blockNum = document.getElementById('blockNum');
        const inputDisplay = document.getElementById('inputDisplay');
        const cameraValue = document.getElementById('cameraValue');
        const moveValue = document.getElementById('moveValue');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const cameraSection = document.getElementById('cameraSection');
        const movementSection = document.getElementById('movementSection');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const imageSelect = document.getElementById('imageSelect');

        const tabBtns = document.querySelectorAll('.tab-btn');
        const selectTab = document.getElementById('selectTab');
        const uploadTab = document.getElementById('uploadTab');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const previewName = document.getElementById('previewName');
        const removeUpload = document.getElementById('removeUpload');
        const promptInput = document.getElementById('promptInput');

        let ws = null;
        let isRunning = false;
        let inputStep = 0;
        let currentCamera = null;
        let currentMovement = null;
        let uploadedImageData = null;

        const CAMERA_KEYS = ['i', 'j', 'k', 'l', 'u'];
        const MOVEMENT_KEYS = ['w', 'a', 's', 'd', 'q'];

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.tab === 'select') {
                    selectTab.style.display = 'block';
                    uploadTab.classList.remove('active');
                } else {
                    selectTab.style.display = 'none';
                    uploadTab.classList.add('active');
                }
            });
        });

        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleImageUpload(e.target.files[0]);
        });

        uploadBtn.addEventListener('dragover', (e) => { e.preventDefault(); uploadBtn.style.borderColor = 'var(--accent)'; });
        uploadBtn.addEventListener('dragleave', () => { uploadBtn.style.borderColor = ''; });
        uploadBtn.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBtn.style.borderColor = '';
            if (e.dataTransfer.files[0]?.type.startsWith('image/')) handleImageUpload(e.dataTransfer.files[0]);
        });

        document.addEventListener('paste', (e) => {
            for (const item of e.clipboardData?.items || []) {
                if (item.type.startsWith('image/')) {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-tab="upload"]').classList.add('active');
                    selectTab.style.display = 'none';
                    uploadTab.classList.add('active');
                    handleImageUpload(item.getAsFile());
                    break;
                }
            }
        });

        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageData = e.target.result;
                previewImg.src = uploadedImageData;
                previewName.textContent = file.name;
                uploadBtn.style.display = 'none';
                uploadPreview.classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        removeUpload.addEventListener('click', () => {
            uploadedImageData = null;
            fileInput.value = '';
            uploadPreview.classList.remove('active');
            uploadBtn.style.display = '';
        });

        async function loadImages() {
            try {
                const res = await fetch('/api/images');
                const data = await res.json();
                const images = data.images.filter(img => img.includes('universal'));
                imageSelect.innerHTML = '';
                images.sort().forEach(img => {
                    const opt = document.createElement('option');
                    opt.value = img;
                    opt.textContent = img.split('/').pop();
                    imageSelect.appendChild(opt);
                });
            } catch (e) { console.error(e); }
        }

        function setStatus(text, state = '') {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        function resetInputState() {
            inputStep = 0;
            currentCamera = currentMovement = null;
            cameraValue.textContent = moveValue.textContent = '-';
            step1.classList.remove('active', 'complete');
            step2.classList.remove('active', 'complete');
            updateKeyStates();
        }

        function startInputSequence() {
            inputStep = 1;  // 1 = waiting for any input
            currentCamera = currentMovement = null;
            cameraValue.textContent = moveValue.textContent = '-';
            step1.classList.remove('complete');
            step2.classList.remove('active', 'complete');
            inputDisplay.textContent = '> press any key...';
            updateKeyStates();
        }

        function updateKeyStates() {
            // Enable all keys when waiting for input
            const enabled = inputStep === 1;
            cameraSection.querySelectorAll('.key:not(.empty)').forEach(k => {
                k.classList.toggle('disabled', !enabled);
                k.classList.remove('active');
            });
            movementSection.querySelectorAll('.key:not(.empty)').forEach(k => {
                k.classList.toggle('disabled', !enabled);
                k.classList.remove('active');
            });
        }

        function handleCameraInput(key) {
            if (inputStep !== 1) return;
            // Camera key pressed: use this camera + Q (no movement)
            currentCamera = key;
            currentMovement = 'q';

            cameraValue.textContent = key.toUpperCase();
            moveValue.textContent = 'Q';
            step1.classList.add('complete');
            step2.classList.add('complete');
            inputStep = 0;
            updateKeyStates();
            highlightKey(key, 'camera');
            highlightKey('q', 'movement');
            inputDisplay.textContent = `> sent: ${key.toUpperCase()} + Q`;
            sendAction();
        }

        function handleMovementInput(key) {
            if (inputStep !== 1) return;
            // Movement key pressed: use U (no camera) + this movement
            currentCamera = 'u';
            currentMovement = key;

            cameraValue.textContent = 'U';
            moveValue.textContent = key.toUpperCase();
            step1.classList.add('complete');
            step2.classList.add('complete');
            inputStep = 0;
            updateKeyStates();
            highlightKey('u', 'camera');
            highlightKey(key, 'movement');
            inputDisplay.textContent = `> sent: U + ${key.toUpperCase()}`;
            sendAction();
        }

        function highlightKey(key, type) {
            const el = document.querySelector(`.key[data-key="${key}"][data-type="${type}"]`);
            if (el) { el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 200); }
        }

        function sendAction() {
            if (ws?.readyState === WebSocket.OPEN && currentCamera && currentMovement) {
                ws.send(JSON.stringify({ type: 'action', keyboard: currentMovement, mouse: currentCamera }));
                setStatus('Processing...', 'waiting');
            }
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);
            ws.onopen = () => { setStatus('Connected', 'connected'); startBtn.disabled = false; };
            ws.onclose = () => { setStatus('Disconnected', 'error'); startBtn.disabled = stopBtn.disabled = true; isRunning = false; setTimeout(connect, 2000); };
            ws.onerror = () => setStatus('Error', 'error');
            ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'frame': displayFrame(msg.data); blockNum.textContent = msg.block; break;
                case 'ready': setStatus('Ready', 'waiting'); break;
                case 'request_action': setStatus(`Block ${msg.block}`, 'waiting'); startInputSequence(); break;
                case 'block_complete': setStatus(`Block ${msg.block} done`, 'connected'); resetInputState(); break;
                case 'generating_image':
                    setStatus('Gemini generating...', 'waiting');
                    inputDisplay.textContent = `> ${msg.message || 'generating world with Gemini...'}`;
                    break;
                case 'complete': case 'stopped':
                    setStatus(msg.type === 'complete' ? 'Complete' : 'Stopped', 'connected');
                    isRunning = false; startBtn.disabled = false; stopBtn.disabled = true;
                    resetInputState(); inputDisplay.textContent = `> ${msg.type}`; break;
                case 'error':
                    setStatus('Error', 'error'); isRunning = false;
                    startBtn.disabled = false; stopBtn.disabled = true; resetInputState(); break;
            }
        }

        function displayFrame(b64) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = 'data:image/jpeg;base64,' + b64;
        }

        document.addEventListener('keydown', (e) => {
            if (e.target === promptInput) return;
            const k = e.key.toLowerCase();
            if (CAMERA_KEYS.includes(k)) handleCameraInput(k);
            else if (MOVEMENT_KEYS.includes(k)) handleMovementInput(k);
        });

        document.querySelectorAll('.key').forEach(el => {
            el.addEventListener('click', () => {
                if (el.classList.contains('disabled')) return;
                const { key, type } = el.dataset;
                if (type === 'camera') handleCameraInput(key);
                else if (type === 'movement') handleMovementInput(key);
            });
        });

        startBtn.addEventListener('click', () => {
            if (ws?.readyState === WebSocket.OPEN) {
                isRunning = true; startBtn.disabled = true; stopBtn.disabled = false;
                resetInputState();
                const prompt = promptInput.value.trim();
                const isUpload = document.querySelector('[data-tab="upload"]').classList.contains('active');
                const image = isUpload && uploadedImageData ? uploadedImageData : imageSelect.value;
                const msg = { type: 'start', image };
                if (prompt) {
                    msg.prompt = prompt;
                    inputDisplay.textContent = '> generating world with Gemini...';
                    setStatus('Generating image...', 'waiting');
                } else {
                    inputDisplay.textContent = '> starting...';
                    setStatus('Starting...', 'waiting');
                }
                ws.send(JSON.stringify(msg));
            }
        });

        stopBtn.addEventListener('click', () => {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
                setStatus('Stopping...', 'waiting');
            }
        });

        // Resize canvas to fill container while maintaining aspect ratio
        function resizeCanvas() {
            const container = document.querySelector('.video-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const aspectRatio = 640 / 352;

            let width, height;
            if (containerWidth / containerHeight > aspectRatio) {
                // Container is wider than video aspect ratio
                height = containerHeight;
                width = height * aspectRatio;
            } else {
                // Container is taller than video aspect ratio
                width = containerWidth;
                height = width / aspectRatio;
            }

            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        loadImages();
        connect();
        resetInputState();
    </script>
</body>
</html>
