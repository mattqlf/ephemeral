<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephemeral</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #161616;
            --border-color: #1f1f1f;
            --border-light: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #00d4aa;
            --accent-dim: rgba(0, 212, 170, 0.15);
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .app {
            display: grid;
            grid-template-columns: 1fr 280px;
            grid-template-rows: auto 1fr;
            height: 100vh;
            gap: 1px;
            background: var(--border-color);
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo-text {
            font-family: var(--font-mono);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .header-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-meta strong {
            color: var(--text-secondary);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .status-dot.waiting {
            background: var(--accent);
            animation: pulse 1.5s infinite;
        }

        .status-dot.error {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Video section */
        .video-section {
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
        }

        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #videoCanvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Image selection bar */
        .image-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .image-bar-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .image-tabs {
            display: flex;
            gap: 2px;
        }

        .tab-btn {
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .tab-btn:first-child { border-radius: 4px 0 0 4px; }
        .tab-btn:last-child { border-radius: 0 4px 4px 0; }

        .tab-btn:hover { border-color: var(--border-light); color: var(--text-secondary); }
        .tab-btn.active { background: var(--bg-tertiary); border-color: var(--border-light); color: var(--text-primary); }

        .image-select-wrapper {
            flex: 1;
            position: relative;
        }

        .image-select-wrapper select {
            width: 100%;
            padding: 8px 32px 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            outline: none;
            appearance: none;
            border-radius: 4px;
        }

        .image-select-wrapper select:hover { border-color: var(--border-light); }

        .image-select-wrapper::after {
            content: '';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 4px solid var(--text-muted);
            pointer-events: none;
        }

        /* Upload inline */
        .upload-inline {
            display: none;
            flex: 1;
            align-items: center;
            gap: 8px;
        }

        .upload-inline.active { display: flex; }

        .upload-btn {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border: 1px dashed var(--border-light);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .upload-preview {
            display: none;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .upload-preview.active { display: flex; }

        .upload-preview img {
            width: 48px;
            height: 27px;
            object-fit: cover;
            border-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .upload-preview-name {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-remove {
            padding: 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 0;
        }

        .upload-remove:hover { color: #ff4444; }

        /* Control panel */
        .control-panel {
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* Key controls */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .key-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .key {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.1s;
            gap: 1px;
        }

        .key:hover:not(.disabled):not(.empty) {
            border-color: var(--border-light);
            color: var(--text-primary);
        }

        .key.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .key.empty {
            visibility: hidden;
        }

        .key.disabled {
            opacity: 0.25;
            pointer-events: none;
        }

        .key-hint {
            font-size: 7px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .key.active .key-hint {
            color: var(--bg-primary);
        }

        /* Input sequence display */
        .sequence-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .sequence-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .sequence-step.active { color: var(--accent); }
        .sequence-step.complete { color: var(--text-primary); }

        .sequence-value {
            font-weight: 500;
            min-width: 16px;
            text-align: center;
        }

        .sequence-arrow {
            color: var(--text-muted);
        }

        /* Hint text */
        .hint-text {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .hint-text code {
            background: var(--bg-tertiary);
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .btn:hover:not(:disabled) {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover:not(:disabled) {
            background: #00e8bb;
            border-color: #00e8bb;
            color: var(--bg-primary);
        }

        /* Hidden file input */
        #fileInput { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <a href="index.html" class="logo">
                <span class="logo-text">Ephemeral</span>
            </a>

            <div class="header-meta">
                <span>Block: <strong id="blockNum">0</strong></span>
                <span>Res: <strong>640x352</strong></span>
            </div>

            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="video-section">
            <div class="video-container">
                <canvas id="videoCanvas" width="640" height="352"></canvas>
                <div class="video-overlay">
                    <span id="inputDisplay">Waiting for input...</span>
                </div>
            </div>

            <div class="image-bar">
                <span class="image-bar-label">Source</span>
                <div class="image-tabs">
                    <button class="tab-btn active" data-tab="select">Demo</button>
                    <button class="tab-btn" data-tab="upload">Upload</button>
                </div>
                <div class="image-select-wrapper" id="selectTab">
                    <select id="imageSelect">
                        <option value="demo_images/universal/0000.png">universal/0000.png</option>
                    </select>
                </div>
                <div class="upload-inline" id="uploadTab">
                    <button class="upload-btn" id="uploadBtn">Choose or drop image...</button>
                    <div class="upload-preview" id="uploadPreview">
                        <img id="previewImg" src="" alt="">
                        <span class="upload-preview-name" id="previewName"></span>
                        <button class="upload-remove" id="removeUpload">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="control-panel">
            <div>
                <div class="section-title">Controls</div>
                <div class="controls-grid">
                    <div class="control-group">
                        <div class="section-title" style="margin-bottom: 4px;">Camera</div>
                        <div class="key-grid" id="cameraSection">
                            <div class="key empty"></div>
                            <div class="key" data-key="i" data-type="camera"><span>I</span><span class="key-hint">up</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="j" data-type="camera"><span>J</span><span class="key-hint">left</span></div>
                            <div class="key" data-key="u" data-type="camera"><span>U</span><span class="key-hint">none</span></div>
                            <div class="key" data-key="l" data-type="camera"><span>L</span><span class="key-hint">right</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="k" data-type="camera"><span>K</span><span class="key-hint">down</span></div>
                            <div class="key empty"></div>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="section-title" style="margin-bottom: 4px;">Movement</div>
                        <div class="key-grid" id="movementSection">
                            <div class="key empty"></div>
                            <div class="key" data-key="w" data-type="movement"><span>W</span><span class="key-hint">fwd</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="a" data-type="movement"><span>A</span><span class="key-hint">left</span></div>
                            <div class="key" data-key="q" data-type="movement"><span>Q</span><span class="key-hint">none</span></div>
                            <div class="key" data-key="d" data-type="movement"><span>D</span><span class="key-hint">right</span></div>
                            <div class="key empty"></div>
                            <div class="key" data-key="s" data-type="movement"><span>S</span><span class="key-hint">back</span></div>
                            <div class="key empty"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="section-title">Input Sequence</div>
                <div class="sequence-display">
                    <div class="sequence-step" id="step1">
                        <span>Cam:</span>
                        <span class="sequence-value" id="cameraValue">-</span>
                    </div>
                    <span class="sequence-arrow">&rarr;</span>
                    <div class="sequence-step" id="step2">
                        <span>Move:</span>
                        <span class="sequence-value" id="moveValue">-</span>
                    </div>
                </div>
            </div>

            <div class="hint-text">
                Press <code>Camera</code> then <code>Movement</code>. Auto-sends after both. Use keyboard or click the keys above.
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="startBtn">Start</button>
                <button class="btn" id="stopBtn" disabled>Stop</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const blockNum = document.getElementById('blockNum');
        const inputDisplay = document.getElementById('inputDisplay');
        const cameraValue = document.getElementById('cameraValue');
        const moveValue = document.getElementById('moveValue');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const cameraSection = document.getElementById('cameraSection');
        const movementSection = document.getElementById('movementSection');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const imageSelect = document.getElementById('imageSelect');

        // Upload elements
        const tabBtns = document.querySelectorAll('.tab-btn');
        const selectTab = document.getElementById('selectTab');
        const uploadTab = document.getElementById('uploadTab');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const previewName = document.getElementById('previewName');
        const removeUpload = document.getElementById('removeUpload');

        let ws = null;
        let isRunning = false;
        let waitingForAction = false;
        let inputStep = 0;
        let currentCamera = null;
        let currentMovement = null;
        let uploadedImageData = null;

        const CAMERA_KEYS = ['i', 'j', 'k', 'l', 'u'];
        const MOVEMENT_KEYS = ['w', 'a', 's', 'd', 'q'];

        // Tab switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const tab = btn.dataset.tab;
                if (tab === 'select') {
                    selectTab.style.display = 'block';
                    uploadTab.classList.remove('active');
                } else {
                    selectTab.style.display = 'none';
                    uploadTab.classList.add('active');
                }
            });
        });

        // File upload
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImageUpload(file);
        });

        // Drag and drop on upload button
        uploadBtn.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBtn.style.borderColor = 'var(--accent)';
            uploadBtn.style.color = 'var(--accent)';
        });

        uploadBtn.addEventListener('dragleave', () => {
            uploadBtn.style.borderColor = '';
            uploadBtn.style.color = '';
        });

        uploadBtn.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBtn.style.borderColor = '';
            uploadBtn.style.color = '';
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImageUpload(file);
            }
        });

        // Paste handling
        document.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) {
                        // Switch to upload tab
                        tabBtns.forEach(b => b.classList.remove('active'));
                        document.querySelector('[data-tab="upload"]').classList.add('active');
                        selectTab.style.display = 'none';
                        uploadTab.classList.add('active');
                        handleImageUpload(file);
                    }
                    break;
                }
            }
        });

        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageData = e.target.result;
                previewImg.src = uploadedImageData;
                previewName.textContent = file.name;
                uploadBtn.style.display = 'none';
                uploadPreview.classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        removeUpload.addEventListener('click', () => {
            uploadedImageData = null;
            previewImg.src = '';
            fileInput.value = '';
            uploadPreview.classList.remove('active');
            uploadBtn.style.display = '';
        });

        // Load available images (only universal)
        async function loadImages() {
            try {
                const response = await fetch('/api/images');
                const data = await response.json();

                // Filter to only universal images
                const universalImages = data.images.filter(img => img.includes('universal'));

                imageSelect.innerHTML = '';
                universalImages.sort().forEach(img => {
                    const option = document.createElement('option');
                    option.value = img;
                    option.textContent = img.split('/').pop();
                    imageSelect.appendChild(option);
                });
            } catch (e) {
                console.error('Failed to load images:', e);
            }
        }

        function setStatus(text, state = '') {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        function resetInputState() {
            inputStep = 0;
            currentCamera = null;
            currentMovement = null;
            cameraValue.textContent = '-';
            moveValue.textContent = '-';
            step1.classList.remove('active', 'complete');
            step2.classList.remove('active', 'complete');
            updateKeyStates();
        }

        function startInputSequence() {
            inputStep = 1;
            currentCamera = null;
            currentMovement = null;
            cameraValue.textContent = '-';
            moveValue.textContent = '-';
            step1.classList.add('active');
            step1.classList.remove('complete');
            step2.classList.remove('active', 'complete');
            inputDisplay.textContent = 'Press camera key (I/J/K/L/U)...';
            updateKeyStates();
        }

        function updateKeyStates() {
            const cameraKeys = cameraSection.querySelectorAll('.key:not(.empty)');
            const moveKeys = movementSection.querySelectorAll('.key:not(.empty)');

            cameraKeys.forEach(key => {
                key.classList.toggle('disabled', inputStep !== 1);
                key.classList.remove('active');
            });

            moveKeys.forEach(key => {
                key.classList.toggle('disabled', inputStep !== 2);
                key.classList.remove('active');
            });
        }

        function handleCameraInput(key) {
            if (inputStep !== 1) return;

            currentCamera = key;
            cameraValue.textContent = key.toUpperCase();
            step1.classList.remove('active');
            step1.classList.add('complete');

            inputStep = 2;
            step2.classList.add('active');
            inputDisplay.textContent = 'Press movement key (W/A/S/D/Q)...';
            updateKeyStates();
            highlightKey(key, 'camera');
        }

        function handleMovementInput(key) {
            if (inputStep !== 2) return;

            currentMovement = key;
            moveValue.textContent = key.toUpperCase();
            step2.classList.remove('active');
            step2.classList.add('complete');
            inputStep = 0;
            updateKeyStates();
            highlightKey(key, 'movement');

            inputDisplay.textContent = `Sent: ${currentCamera.toUpperCase()} + ${currentMovement.toUpperCase()}`;
            sendAction();
        }

        function highlightKey(key, type) {
            const keyEl = document.querySelector(`.key[data-key="${key}"][data-type="${type}"]`);
            if (keyEl) {
                keyEl.classList.add('active');
                setTimeout(() => keyEl.classList.remove('active'), 200);
            }
        }

        function sendAction() {
            if (ws && ws.readyState === WebSocket.OPEN && currentCamera && currentMovement) {
                ws.send(JSON.stringify({
                    type: 'action',
                    keyboard: currentMovement,
                    mouse: currentCamera
                }));
                waitingForAction = false;
                setStatus('Processing...', 'waiting');
            }
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                startBtn.disabled = false;
            };

            ws.onclose = () => {
                setStatus('Disconnected', 'error');
                startBtn.disabled = true;
                stopBtn.disabled = true;
                isRunning = false;
                setTimeout(connect, 2000);
            };

            ws.onerror = () => {
                setStatus('Connection error', 'error');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'frame':
                    displayFrame(msg.data);
                    blockNum.textContent = msg.block;
                    break;

                case 'ready':
                    setStatus('Ready', 'waiting');
                    break;

                case 'request_action':
                    waitingForAction = true;
                    setStatus(`Block ${msg.block}`, 'waiting');
                    startInputSequence();
                    break;

                case 'block_complete':
                    setStatus(`Block ${msg.block} done`, 'connected');
                    resetInputState();
                    break;

                case 'complete':
                    setStatus('Complete', 'connected');
                    isRunning = false;
                    waitingForAction = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    resetInputState();
                    inputDisplay.textContent = 'Generation complete';
                    break;

                case 'stopped':
                    setStatus('Stopped', 'connected');
                    isRunning = false;
                    waitingForAction = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    resetInputState();
                    inputDisplay.textContent = 'Stopped';
                    break;

                case 'error':
                    setStatus('Error', 'error');
                    isRunning = false;
                    waitingForAction = false;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    resetInputState();
                    break;
            }
        }

        function displayFrame(base64Data) {
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = 'data:image/jpeg;base64,' + base64Data;
        }

        // Keyboard handling
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (CAMERA_KEYS.includes(key)) {
                handleCameraInput(key);
            } else if (MOVEMENT_KEYS.includes(key)) {
                handleMovementInput(key);
            }
        });

        // Click handling for on-screen keys
        document.querySelectorAll('.key').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.key;
                const type = el.dataset.type;
                if (!key || el.classList.contains('disabled')) return;

                if (type === 'camera') {
                    handleCameraInput(key);
                } else if (type === 'movement') {
                    handleMovementInput(key);
                }
            });
        });

        startBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                resetInputState();
                inputDisplay.textContent = 'Starting...';

                const isUploadMode = document.querySelector('[data-tab="upload"]').classList.contains('active');

                const payload = {
                    type: 'start',
                    image: isUploadMode && uploadedImageData ? uploadedImageData : imageSelect.value
                };

                ws.send(JSON.stringify(payload));
                setStatus('Starting...', 'waiting');
            }
        });

        stopBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop' }));
                setStatus('Stopping...', 'waiting');
            }
        });

        // Initialize
        loadImages();
        connect();
        resetInputState();
    </script>
</body>
</html>
